name: Release

# Publishes the library to nuget.org and creates a GitHub release when a version tag is pushed, e.g.:
#   git tag v4.1.0
#   git push origin v4.1.0
# The package version is taken from the tag (v4.1.0 -> 4.1.0, v4.2.0-beta1 -> 4.2.0-beta1).
# The release notes are taken from the matching "### <version>" section of the version history in README.md.
#
# To release an existing tag again (e.g., to create a missing GitHub release), run the workflow manually
# with the tag as input. Packages that are already on nuget.org are skipped.
#
# Authentication uses NuGet Trusted Publishing (no stored API key):
# https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
# Requires a trusted publishing policy on nuget.org for this repository and the workflow file
# "release.yml", plus the repository secret NUGET_USER (nuget.org profile name, not the email address).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release, e.g. v4.0.0'
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Publish to NuGet and GitHub
    runs-on: windows-latest
    permissions:
      contents: write # Create the GitHub release
      id-token: write # Request the OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          # Always the newest .NET 10 SDK; global.json allows newer feature bands.
          dotnet-version: 10.0.x

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Tag '$env:TAG' is not a valid version tag (expected e.g. v4.0.0 or v4.1.0-beta1)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install workloads
        run: dotnet workload install maui

      - name: Test
        run: dotnet test --project tests/UniversalBeacon.Library.Tests/UniversalBeacon.Library.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack src/UniversalBeacon.Library/UniversalBeacon.Library.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: artifacts/*

      # Request the short-lived API key right before pushing - it is valid for one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes each package by its full path: on Windows, dotnet nuget push does not expand
      # wildcards with forward slashes ("artifacts/*.nupkg"). Each push also uploads the matching
      # symbol package (.snupkg). --skip-duplicate keeps re-runs from failing for packages that
      # are already published.
      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem -Path artifacts -Filter *.nupkg
          if ($packages.Count -eq 0) { throw "No packages found in artifacts." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Pushing $($package.Name) failed." }
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Release notes: the "### <version>" section of the version history in README.md
          $lines = Get-Content README.md
          $heading = '^### ' + [regex]::Escape($env:VERSION) + '(\s|$)'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match $heading) { $start = $i; break } }
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^#{1,3} '; $i++) { $notes += $lines[$i] }
          } else {
            Write-Warning "No section for $env:VERSION found in the README version history."
          }
          $notes += ''
          $notes += "NuGet package: https://www.nuget.org/packages/UniversalBeaconLibrary/$env:VERSION"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ($notes -join "`n").Trim() | Set-Content -Path $notesFile -Encoding utf8

          $assets = (Get-ChildItem -Path artifacts -File).FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release exists already (e.g., re-run) - update notes and assets.
            gh release edit $env:TAG --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Updating the release failed." }
            gh release upload $env:TAG @assets --clobber
          } else {
            $releaseArgs = @($env:TAG, '--verify-tag', '--title', "Version $env:VERSION", '--notes-file', $notesFile)
            if ($env:VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
            gh release create @releaseArgs @assets
          }
          if ($LASTEXITCODE -ne 0) { throw "Creating the GitHub release failed." }
