version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      maui:
        patterns: [ "Microsoft.Maui.*", "Microsoft.Extensions.*" ]
      xunit:
        patterns: [ "xunit*" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
